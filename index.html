<title>Postes MAT · GDAnalytics</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #eef1f0; --panel: #ffffff; --fg: #1d2523; --muted: #5d6b67; --line: #d3dbd8;
  --accent: #d9711c; --azul: #4ea3dc; --topo: #0b0b0a; --blx: #f9d10f;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121615; --panel: #1a201e; --fg: #e3ebe8; --muted: #93a39e; --line: #2b3532; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
header {
  background: var(--topo); color: #fff; text-align: center;
  padding: max(28px, env(safe-area-inset-top, 0px)) 16px 26px;
}
header img.gda { width: min(320px, 78vw); height: auto; display: block; margin: 0 auto; }
header h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; margin: 18px 0 2px; letter-spacing: .01em; }
header p { margin: 0; color: #b9c2bf; font-size: .92rem; }
main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 22px 16px 8px; display: grid; gap: 14px; align-content: start; }
a.opcao {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px;
  background: var(--panel); color: var(--fg); text-decoration: none; border: 1px solid var(--line);
  border-radius: 12px; padding: 18px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  transition: border-color .15s, transform .15s;
}
a.opcao:hover, a.opcao:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-1px); }
a.opcao:active { transform: translateY(0); }
.ic { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; }
.ic svg { width: 40px; height: 40px; }
.ic.ver { background: color-mix(in srgb, var(--azul) 16%, transparent); color: var(--azul); }
.ic.insp { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.opcao b { display: block; font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.opcao span.d { display: block; color: var(--muted); font-size: .88rem; margin-top: 3px; line-height: 1.35; }
.opcao .seta { font-size: 1.6rem; color: var(--muted); }
.estado { font-size: .85rem; color: var(--muted); text-align: center; min-height: 1.2em; }
footer {
  display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 16px max(20px, env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: .8rem;
}
footer img.blx { height: 46px; width: auto; border-radius: 6px; display: block; }
footer .txt { line-height: 1.4; }
footer .txt b { color: var(--fg); font-weight: 600; }
</style>
</head>
